<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lấy hàng · v1.9</title>
<meta name="theme-color" content="#f5f7fb"><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#778197;--line:#e7eaf0;--accent:#2563eb;--ok:#16803c;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:20px 14px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}.top h1{font-size:24px;margin:0}.settings-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:20px;cursor:pointer}.modal-bg{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:center;justify-content:center;padding:16px}.modal-bg.show{display:flex}.modal{width:min(420px,100%);background:#fff;border-radius:18px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#f2f4f8;border-radius:10px;width:36px;height:36px;font-size:20px}.unit-add{display:flex;gap:8px;margin-bottom:12px}.unit-add input{flex:1;border:1px solid #d9dee8;border-radius:11px;padding:12px;font-size:16px}.unit-add button{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:0 15px;font-weight:800}.unit-list{display:grid;gap:7px;max-height:45vh;overflow:auto}.unit-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f7f8fb;border-radius:11px}.unit-row button{border:0;background:#fff0f0;color:var(--danger);border-radius:8px;padding:7px 9px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 18px #18233b0a}.form{display:grid;grid-template-columns:1fr 90px 110px;gap:10px}.form input,.form select{width:100%;border:1px solid #d9dee8;border-radius:12px;padding:14px;font-size:16px;outline:none;background:#fff}.form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb18}.add{grid-column:1/-1;border:0;border-radius:12px;padding:14px;background:var(--accent);color:white;font-weight:750;font-size:16px;cursor:pointer}.tabs{display:flex;gap:8px;margin:18px 0 10px}.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;color:var(--muted);cursor:pointer}.tab.active{background:#172033;color:#fff;border-color:#172033}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.main{min-width:0;flex:1}.name{font-weight:750;font-size:16px;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--muted);margin-top:4px}.qty{font-weight:800;background:#eef3ff;color:#234ea4;border-radius:10px;padding:7px 9px;white-space:nowrap}.undo{border:0;background:#fff7e6;color:#a15c00;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.done{border:0;background:#eaf8ee;color:var(--ok);border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.del{border:0;background:#fff0f0;color:var(--danger);border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:34px 12px}.foot{text-align:center;color:#9aa3b3;font-size:12px;margin-top:18px}@media(max-width:430px){.app{padding:14px 10px 32px}h1{font-size:21px}.form{grid-template-columns:1fr 76px 92px}.item{gap:8px;padding:11px}.name{font-size:15px}.qty{padding:6px 8px}.done,.del{padding:8px 9px}}
.form{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px}.form #name{grid-column:1/-1!important}.form .add{grid-column:1/-1!important}
.historyBtn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 11px;font-weight:750;cursor:pointer;white-space:nowrap}.historyOverlay{position:fixed;inset:0;background:#17203366;z-index:90;display:none;align-items:flex-end;justify-content:center}.historyOverlay.show{display:flex}.historyPanel{width:min(680px,100%);height:min(82vh,720px);background:var(--bg);border-radius:22px 22px 0 0;padding:15px 14px 24px;overflow:auto}.historyHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.historyHead h2{font-size:20px;margin:0}.closeHistory{border:0;background:#e7eaf0;border-radius:10px;width:38px;height:38px;font-size:20px}.historySearch{width:100%;border:1px solid #d9dee8;border-radius:12px;padding:13px 14px;font-size:16px;background:#fff;margin-bottom:12px}.historyCount{font-size:13px;color:var(--muted);margin:0 2px 10px}
.editOverlay{position:fixed;inset:0;background:#17203366;z-index:110;display:none;align-items:flex-end;justify-content:center}.editOverlay.show{display:flex}.editPanel{width:min(680px,100%);background:var(--bg);border-radius:22px 22px 0 0;padding:16px 14px 24px}.editPanel h2{font-size:20px;margin:0 0 14px}.editPanel input,.editPanel select{width:100%;border:1px solid #d9dee8;border-radius:12px;padding:13px;font-size:16px;background:#fff}.editRow,.editActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.editCancel,.editSave{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px}.editCancel{background:#e7eaf0}.editSave{background:var(--accent);color:#fff}.item{user-select:none;-webkit-user-select:none}
.app{max-width:620px;padding:14px 12px 30px}.uiTop{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.brand{min-width:0;flex:1}.brand h1{font-size:27px;line-height:1.05;letter-spacing:-.6px;margin:0;display:flex;align-items:baseline;gap:7px}.version{font-size:11px;color:var(--muted);font-weight:800}.syncStatus{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topActions{display:flex;align-items:center;gap:8px}.historyBtn,.settings-btn{height:42px;border-radius:13px}.historyBtn{padding:0 12px;font-size:14px}.settings-btn{width:42px;font-size:19px}.card{border-radius:17px;padding:12px}.form{gap:8px!important}.form input,.form select{min-height:48px;border-radius:12px;padding:11px 13px}.add{min-height:48px;padding:11px}.tabs{margin:12px 0 9px;gap:8px}.tab{min-height:44px;padding:9px}.list{gap:8px}.item{min-height:70px;border-radius:14px;padding:11px 12px;gap:8px}.name{font-size:16px;line-height:1.25}.meta{font-size:12px;margin-top:3px}.qty{font-size:14px;padding:7px 9px}.done,.undo,.del{min-height:38px;padding:8px 10px}.foot{margin-top:16px;font-size:11px}.historyPanel,.editPanel{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media(max-width:430px){.app{padding:10px 10px 26px}.uiTop{margin-bottom:10px}.brand h1{font-size:25px}.historyBtn span{display:none}.historyBtn{width:42px;padding:0;font-size:18px}.card{padding:10px}.form{gap:7px!important}.form input,.form select,.add{min-height:46px}.tabs{margin-top:10px}.item{padding:10px}.name{font-size:15px}.meta{font-size:11.5px}.qty{font-size:13px}.done,.undo,.del{font-size:13px;padding:7px 9px}}
</style></head>
<body><main class="app">
<header class="top uiTop"><div class="brand"><h1>Lấy hàng <span class="version">v1.9</span></h1><div id="syncStatus" class="syncStatus">🔄 Đang khởi động...</div></div><div class="topActions"><button id="historyBtn" class="historyBtn">🕘 <span>Lịch sử</span></button><button class="settings-btn" id="settingsBtn">⚙</button></div></header>
<section class="card"><form id="form" class="form"><input id="name" autocomplete="off" placeholder="Tên sản phẩm" required><input id="qty" type="number" inputmode="numeric" min="1" value="1" required><select id="unit"></select><button class="add">Lấy hàng</button></form></section>
<div class="tabs"><button class="tab active" data-tab="pending">Chờ lấy <span id="pendingCount">0</span></button><button class="tab" data-tab="done">Đã lấy <span id="doneCount">0</span></button></div><div id="list" class="list"></div><div class="foot">Offline-first · dữ liệu lưu trên máy và tự đồng bộ khi có mạng</div>
<div id="historyOverlay" class="historyOverlay"><section class="historyPanel"><div class="historyHead"><h2>Lịch sử đã lấy</h2><button id="closeHistory" class="closeHistory">×</button></div><input id="historySearch" class="historySearch" placeholder="Tìm tên sản phẩm..."><div id="historyCount" class="historyCount"></div><div id="historyList" class="list"></div></section></div>
<div id="editOverlay" class="editOverlay"><section class="editPanel"><h2>Chỉnh sửa món hàng</h2><input id="editName"><div class="editRow"><input id="editQty" type="number" min="1"><select id="editUnit"></select></div><div class="editActions"><button id="editCancel" class="editCancel">Hủy</button><button id="editSave" class="editSave">Lưu thay đổi</button></div></section></div></main>
<div class="modal-bg" id="settingsModal"><div class="modal"><div class="modal-head"><h2>Cài đặt đơn vị</h2><button class="close" id="closeSettings">×</button></div><div class="unit-add"><input id="newUnit" placeholder="Thêm đơn vị"><button id="addUnit">+ Thêm</button></div><div id="unitList" class="unit-list"></div></div></div>
<script>
const DB_URL="https://lay-hang-default-rtdb.asia-southeast1.firebasedatabase.app/layhang.json",LOCAL_KEY="layhang-v1.9-state",DIRTY_KEY="layhang-v1.9-dirty",OLD_LOCAL_KEY="layhang-v1.7-state";
const $=x=>document.querySelector(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=t=>{const d=new Date(t);return d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"})+" · "+d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})};
const DEFAULT_UNITS=["bộ","cái","chai","cuộn","đôi","gói","hộp","mét","túi","vỉ"],sortUnits=a=>[...new Set((a||[]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"vi",{sensitivity:"base"}));
let state={jobs:[],units:sortUnits(DEFAULT_UNITS),updatedAt:0},tab="pending",editingId=null,syncing=false;
function normalize(v){v=v||{};return{jobs:Array.isArray(v.jobs)?v.jobs:Object.values(v.jobs||{}),units:sortUnits(Array.isArray(v.units)?v.units:Object.values(v.units||DEFAULT_UNITS)),updatedAt:Number(v.updatedAt)||0}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");if(v)state=normalize(v)}catch{}render();renderUnits()}
async function bootstrap(){const has=!!localStorage.getItem(LOCAL_KEY);if(has){loadLocal();updateStatus();await sync();return}updateStatus({text:navigator.onLine?"🔄 Đang tải dữ liệu Firebase...":"🟠 Offline · đang dùng dữ liệu đã lưu trên máy",color:"#2563eb"});if(navigator.onLine)try{const r=await fetch(DB_URL+"?t="+Date.now(),{cache:"no-store"}),raw=await r.json();if(raw){state=normalize(raw);localStorage.setItem(LOCAL_KEY,JSON.stringify(state));localStorage.removeItem(DIRTY_KEY);render();renderUnits();updateStatus();return}}catch{}try{const old=JSON.parse(localStorage.getItem(OLD_LOCAL_KEY)||"null");if(old){state=normalize(old);localStorage.setItem(LOCAL_KEY,JSON.stringify(state));render();renderUnits();updateStatus();return}}catch{}loadLocal();updateStatus()}
function saveLocal(d=true){state.units=sortUnits(state.units);state.updatedAt=Date.now();localStorage.setItem(LOCAL_KEY,JSON.stringify(state));if(d)localStorage.setItem(DIRTY_KEY,"1");render();renderUnits();if($("#historyOverlay")?.classList.contains("show"))renderHistory();updateStatus()}
const isDirty=()=>localStorage.getItem(DIRTY_KEY)==="1";
function updateStatus(m){const s=$("#syncStatus");if(m){s.textContent=m.text;s.style.color=m.color;return}if(!navigator.onLine){s.textContent="🟠 Offline · đã lưu trên máy";s.style.color="#a15c00"}else if(isDirty()){s.textContent="🔄 Có thay đổi đang chờ đồng bộ";s.style.color="#a15c00"}else{s.textContent="🟢 Đã đồng bộ · Online";s.style.color="#16803c"}}
async function pushRemote(){if(!navigator.onLine||syncing||!isDirty())return;syncing=true;try{const r=await fetch(DB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)});if(!r.ok)throw 0;localStorage.removeItem(DIRTY_KEY);updateStatus()}catch{updateStatus({text:"🟠 Chưa đồng bộ · dữ liệu vẫn an toàn trên máy",color:"#a15c00"})}finally{syncing=false}}
async function pullRemote(){if(!navigator.onLine||syncing||isDirty())return;try{const r=await fetch(DB_URL+"?t="+Date.now(),{cache:"no-store"}),remote=normalize(await r.json());if(remote.updatedAt>state.updatedAt){state=remote;localStorage.setItem(LOCAL_KEY,JSON.stringify(state));render();renderUnits()}updateStatus()}catch{}}
async function sync(){if(!navigator.onLine){updateStatus();return}if(isDirty())await pushRemote();else await pullRemote()}
function renderUnits(){const s=$("#unit"),old=s?.value;if(s){s.innerHTML=state.units.map(u=>`<option>${esc(u)}</option>`).join("");if(state.units.includes(old))s.value=old}const e=$("#editUnit");if(e&&!$("#editOverlay").classList.contains("show"))e.innerHTML=state.units.map(u=>`<option>${esc(u)}</option>`).join("");$("#unitList").innerHTML=state.units.map(u=>`<div class="unit-row"><span>${esc(u)}</span><button data-unit="${encodeURIComponent(u)}">Xóa</button></div>`).join("")}
function render(){const p=state.jobs.filter(x=>!x.done),d=state.jobs.filter(x=>x.done);$("#pendingCount").textContent=p.length;$("#doneCount").textContent=d.length;const a=tab==="pending"?p:d;$("#list").innerHTML=a.length?a.map(x=>`<div class="item" data-job-id="${x.id}"><div class="main"><div class="name">${esc(x.name)}</div><div class="meta">${x.done?"Hoàn thành "+fmt(x.doneAt):"Giao lúc "+fmt(x.createdAt)}</div></div><div class="qty">${x.qty} ${esc(x.unit||"cái")}</div>${x.done?`<button class="done undo" data-id="${x.id}">↶ Hoàn tác</button><button class="del" data-id="${x.id}">Xóa</button>`:`<button class="done finish" data-id="${x.id}">✓ Xong</button>`}</div>`).join(""):`<div class="empty">${tab==="pending"?"Chưa có việc cần lấy":"Chưa có việc hoàn thành"}</div>`}
function changed(){saveLocal(true);sync()}
$("#list").addEventListener("click",e=>{const id=e.target.dataset.id,x=state.jobs.find(j=>j.id===id);if(e.target.classList.contains("finish")&&x){x.done=true;x.doneAt=Date.now();changed()}if(e.target.classList.contains("undo")&&x){x.done=false;delete x.doneAt;changed()}if(e.target.classList.contains("del")){state.jobs=state.jobs.filter(j=>j.id!==id);changed()}});
$("#form").addEventListener("submit",e=>{e.preventDefault();const name=$("#name").value.trim(),qty=Math.max(1,parseInt($("#qty").value)||1),unit=$("#unit").value||"cái";if(!name)return;state.jobs.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,qty,unit,createdAt:Date.now(),done:false});$("#name").value="";$("#qty").value=1;changed()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
function renderHistory(){const q=($("#historySearch").value||"").trim().toLocaleLowerCase("vi-VN");let a=state.jobs.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));if(q)a=a.filter(x=>String(x.name||"").toLocaleLowerCase("vi-VN").includes(q));$("#historyCount").textContent=a.length+" món đã lấy";$("#historyList").innerHTML=a.length?a.map(x=>`<div class="item"><div class="main"><div class="name">${esc(x.name)}</div><div class="meta">Đã lấy ${fmt(x.doneAt||x.createdAt)}</div></div><div class="qty">${x.qty} ${esc(x.unit||"cái")}</div></div>`).join(""):`<div class="empty">Chưa có lịch sử</div>`}
$("#historyBtn").onclick=()=>{$("#historyOverlay").classList.add("show");$("#historySearch").value="";renderHistory()};$("#closeHistory").onclick=()=>$("#historyOverlay").classList.remove("show");$("#historySearch").oninput=renderHistory;
let timer,start;$("#list").addEventListener("pointerdown",e=>{const i=e.target.closest(".item[data-job-id]");if(!i||e.target.closest("button")||tab!=="pending")return;start={x:e.clientX,y:e.clientY};timer=setTimeout(()=>openEdit(i.dataset.jobId),550)});["pointerup","pointercancel","pointerleave"].forEach(v=>$("#list").addEventListener(v,()=>clearTimeout(timer)));
function openEdit(id){const x=state.jobs.find(j=>j.id===id);if(!x)return;editingId=id;$("#editName").value=x.name;$("#editQty").value=x.qty;$("#editUnit").innerHTML=state.units.map(u=>`<option>${esc(u)}</option>`).join("");$("#editUnit").value=x.unit||"cái";$("#editOverlay").classList.add("show")}
const closeEdit=()=>{$("#editOverlay").classList.remove("show");editingId=null};$("#editCancel").onclick=closeEdit;$("#editSave").onclick=()=>{const x=state.jobs.find(j=>j.id===editingId);if(!x)return;x.name=$("#editName").value.trim()||x.name;x.qty=Math.max(1,parseInt($("#editQty").value)||1);x.unit=$("#editUnit").value;closeEdit();changed()};
const sm=$("#settingsModal");$("#settingsBtn").onclick=()=>{renderUnits();sm.classList.add("show")};$("#closeSettings").onclick=()=>sm.classList.remove("show");$("#addUnit").onclick=()=>{const i=$("#newUnit"),u=i.value.trim();if(u&&!state.units.includes(u)){state.units.push(u);i.value="";changed()}};$("#unitList").onclick=e=>{if(e.target.dataset.unit){const u=decodeURIComponent(e.target.dataset.unit);state.units=state.units.filter(x=>x!==u);changed()}};
window.addEventListener("online",sync);window.addEventListener("offline",updateStatus);bootstrap();setInterval(sync,5000);if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
