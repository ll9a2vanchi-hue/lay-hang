function render(){const p=state.jobs.filter(x=>!x.done),d=state.jobs.filter(x=>x.done);$("#pendingCount").textContent=p.length;$("#doneCount").textContent=d.length;const bp=$("#bannerPending");if(bp)bp.textContent=p.length+" món chờ lấy";$("#shortCount").textContent=p.filter(x=>x.status==="Thiếu đóng hàng").length;const a=(tab==="pending"?p:d).filter(x=>!shortOnly||x.status==="Thiếu đóng hàng");$("#list").innerHTML=a.length?a.map(x=>{const fresh=!x.done&&seen[x.id]>0&&Date.now()-seen[x.id]<300000;return `<div class="item${fresh?" isNew":""}${x.status==="Thiếu đóng hàng"?" shortage":""}" data-job-id="${x.id}"><div class="main"><div class="name">${esc(x.name)}${fresh?`<span class="newBadge">● Mới</span>`:""}</div>${x.status==="Thiếu đóng hàng"?`<div class="statusTag">Thiếu đóng hàng</div>`:""}<div class="meta">${x.done?"Hoàn thành "+fmt(x.doneAt):"Giao lúc "+fmt(x.createdAt)}</div>${x.oldCost!==undefined&&x.oldCost!==null&&String(x.oldCost).trim()!==""?`<div class="oldCostDisplay">Giá vốn cũ: <strong>${Number(x.oldCost).toLocaleString("vi-VN")}đ</strong></div>`:""}</div>${String(x.qty||"").trim()?`<div class="qty">${esc(String(x.qty))}${x.unit?" "+esc(x.unit):""}</div>`:""}${x.done?`<button class="done undo" data-id="${x.id}">↶ Hoàn tác</button><button class="del" data-id="${x.id}">Xóa</button>`:`<button class="done finish" data-id="${x.id}">✓ Xong</button>`}</div>`}).join(""):`<div class="empty">${tab==="pending"?"Chưa có việc cần lấy":"Chưa có việc hoàn thành"}</div>`}
function changed(){saveLocal(true);sync()}$("#filterAll").onclick=()=>{shortOnly=false;$("#filterAll").classList.add("active");$("#filterShort").classList.remove("active");render()};$("#filterShort").onclick=()=>{shortOnly=true;$("#filterShort").classList.add("active");$("#filterAll").classList.remove("active");render()};let undoTimer;$("#undoLast").onclick=()=>{if(lastFinished){const x=state.jobs.find(j=>j.id===lastFinished);if(x){x.done=false;delete x.doneAt;changed()}lastFinished=null}$("#undoToast").hidden=true};
$("#list").addEventListener("click",e=>{const id=e.target.dataset.id,x=state.jobs.find(j=>j.id===id);if(e.target.classList.contains("finish")&&x){x.done=true;x.doneAt=Date.now();lastFinished=x.id;changed();$("#undoText").textContent="Đã lấy: "+x.name.slice(0,23);$("#undoToast").hidden=false;clearTimeout(undoTimer);undoTimer=setTimeout(()=>$("#undoToast").hidden=true,5500)}if(e.target.classList.contains("undo")&&x){x.done=false;delete x.doneAt;changed()}if(e.target.classList.contains("del")){state.jobs=state.jobs.filter(j=>j.id!==id);changed()}});
function updateNameSuggestions(){const box=$("#nameSuggestions"),q=$("#name").value.trim().toLocaleLowerCase("vi-VN");if(!q){box.hidden=true;box.innerHTML="";return}const names=new Map();for(const x of state.jobs){if(!x.done||!x.name)continue;const key=x.name.trim().toLocaleLowerCase("vi-VN");if(!key.includes(q))continue;const time=x.doneAt||x.createdAt||0;if(!names.has(key)||time>names.get(key).time)names.set(key,{name:x.name.trim(),time,key})}const a=[...names.values()].sort((a,b)=>(a.key.startsWith(q)?0:1)-(b.key.startsWith(q)?0:1)||b.time-a.time).slice(0,7);box.innerHTML=a.map(x=>'<button type="button" class="nameSuggestion" data-suggest="'+encodeURIComponent(x.name)+'">'+esc(x.name)+'</button>').join("");box.hidden=!a.length}$("#name").addEventListener("input",updateNameSuggestions);$("#name").addEventListener("focus",updateNameSuggestions);$("#nameSuggestions").addEventListener("pointerdown",e=>{const b=e.target.closest("[data-suggest]");if(e.pointerType==="mouse"&&b)e.preventDefault()});$("#nameSuggestions").addEventListener("click",e=>{const b=e.target.closest("[data-suggest]");if(!b)return;$("#name").value=decodeURIComponent(b.dataset.suggest);$("#nameSuggestions").hidden=true;$("#qty").focus()});document.addEventListener("click",e=>{if(!e.target.closest(".nameSuggestWrap"))$("#nameSuggestions").hidden=true});
$("#form").addEventListener("submit",e=>{e.preventDefault();const name=$("#name").value.trim(),qty=$("#qty").value.trim(),unit=$("#unit").value||"",status="";if(!name)return;state.jobs.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,qty,unit,status,createdAt:Date.now(),done:false});seen[state.jobs[0].id]=-1;rememberSeen();$("#name").value="";$("#qty").value="";$("#nameSuggestions").hidden=true;changed();$("#unit").value=""});
$("#qtyMinus").onclick=()=>{const q=$("#qty");q.value=String(Math.max(0,(parseInt(q.value)||0)-1))};$("#qtyPlus").onclick=()=>{const q=$("#qty");q.value=(parseInt(q.value)||0)+1};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
function renderHistory(){const q=($("#historySearch").value||"").trim().toLocaleLowerCase("vi-VN");let a=state.jobs.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));if(q)a=a.filter(x=>String(x.name||"").toLocaleLowerCase("vi-VN").includes(q));$("#historyCount").textContent=a.length+" món đã lấy";$("#historyList").innerHTML=a.length?a.map(x=>`<div class="item"><div class="main"><div class="name">${esc(x.name)}</div><div class="meta">Đã lấy ${fmt(x.doneAt||x.createdAt)}</div></div><div class="qty">${String(x.qty||"").trim()?esc(String(x.qty))+(x.unit?" "+esc(x.unit):""):""}</div></div>`).join(""):`<div class="empty">Chưa có lịch sử</div>`}
$("#historyBtn").onclick=()=>{$("#historyOverlay").classList.add("show");$("#historySearch").value="";renderHistory()};$("#closeHistory").onclick=()=>$("#historyOverlay").classList.remove("show");$("#historySearch").oninput=renderHistory;
let timer,start;$("#list").addEventListener("pointerdown",e=>{const i=e.target.closest(".item[data-job-id]");if(!i||e.target.closest("button")||tab!=="pending")return;start={x:e.clientX,y:e.clientY};timer=setTimeout(()=>openEdit(i.dataset.jobId),550)});["pointerup","pointercancel","pointerleave"].forEach(v=>$("#list").addEventListener(v,()=>clearTimeout(timer)));
function openEdit(id){const x=state.jobs.find(j=>j.id===id);if(!x)return;editingId=id;$("#editName").value=x.name;$("#editQty").value=x.qty;$("#editUnit").innerHTML=`<option value="">Không đơn vị</option>`+state.units.map(u=>`<option>${esc(u)}</option>`).join("");$("#editUnit").value=x.unit||"";$("#editStatus").value=x.status==="Thiếu đóng hàng"?"Thiếu đóng hàng":"";$("#editOldCost").value=x.oldCost??"";$("#editOverlay").classList.add("show")}
const closeEdit=()=>{$("#editOverlay").classList.remove("show");editingId=null};$("#editCancel").onclick=closeEdit;$("#editOverlay").onclick=e=>{if(e.target===$("#editOverlay"))closeEdit()};$("#editDelete").onclick=()=>{if(!editingId)return;state.jobs=state.jobs.filter(j=>j.id!==editingId);closeEdit();changed()};$("#editSave").onclick=()=>{const x=state.jobs.find(j=>j.id===editingId);if(!x)return;x.name=$("#editName").value.trim()||x.name;x.qty=$("#editQty").value.trim();x.unit=$("#editUnit").value;x.status=$("#editStatus").value;x.oldCost=$("#editOldCost").value.trim();closeEdit();changed()};
const NOTIFY_KEY="layhang-alert";function notifyOn(){return localStorage.getItem(NOTIFY_KEY)==="1"}function renderNotify(){const b=$("#notifyToggle"),on=notifyOn();b.textContent=on?"Đang bật":"Bật";b.classList.toggle("on",on)}function alertNew(a){if(!notifyOn())return;const t=$("#toast");t.textContent=a.length===1?"Có hàng mới: "+a[0].name:"Có "+a.length+" sản phẩm mới cần lấy";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3500);if(navigator.vibrate)navigator.vibrate([120,70,120]);try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.03;o.frequency.value=760;o.start();setTimeout(()=>{o.stop();c.close()},150)}catch{}}$("#notifyToggle").onclick=()=>{localStorage.setItem(NOTIFY_KEY,notifyOn()?"0":"1");renderNotify()};const sm=$("#settingsModal");$("#settingsBtn").onclick=()=>{renderUnits();renderNotify();sm.classList.add("show")};$("#closeSettings").onclick=()=>sm.classList.remove("show");$("#addUnit").onclick=()=>{const i=$("#newUnit"),u=i.value.trim();if(u&&!state.units.includes(u)){state.units.push(u);i.value="";changed()}};$("#unitList").onclick=e=>{if(e.target.dataset.unit){const u=decodeURIComponent(e.target.dataset.unit);state.units=state.units.filter(x=>x!==u);changed()}};
function updateClock(){const d=new Date(),el=$("#bannerClock");if(el)el.textContent=d.toLocaleDateString("vi-VN",{weekday:"short",day:"2-digit",month:"2-digit"})+" · "+d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}updateClock();setInterval(updateClock,1000);window.addEventListener("online",sync);window.addEventListener("offline",updateStatus);bootstrap();setInterval(sync,5000);setInterval(render,15000);if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
